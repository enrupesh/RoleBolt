services:
  - type: web
    name: recruit-backend
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: rm -rf node_modules .cache && npm install --no-audit --no-fund && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GEMINI_MESH_KEY
        sync: false
      - key: GEMINI_PRIMARY_KEY
        sync: false
      - key: GEMINI_FALLBACK_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_PLAN_SEEKER_PRO_MONTHLY
        sync: false
      - key: RAZORPAY_PLAN_SEEKER_PRO_YEARLY
        sync: false
      - key: RAZORPAY_PLAN_SEEKER_ULTRA_MONTHLY
        sync: false
      - key: RAZORPAY_PLAN_SEEKER_ULTRA_YEARLY
        sync: false
      - key: RAZORPAY_PLAN_CREATOR_FORM_PRO_MONTHLY
        sync: false
      - key: RAZORPAY_PLAN_CREATOR_FORM_PRO_YEARLY
        sync: false
      - key: RAZORPAY_PLAN_CREATOR_FORM_ULTRA_MONTHLY
        sync: false
      - key: RAZORPAY_PLAN_CREATOR_FORM_ULTRA_YEARLY
        sync: false
      - key: RAZORPAY_PLAN_CREATOR_STANDARD_PRO_MONTHLY
        sync: false
      - key: RAZORPAY_PLAN_CREATOR_STANDARD_PRO_YEARLY
        sync: false
      - key: RAZORPAY_PLAN_CREATOR_STANDARD_ULTRA_MONTHLY
        sync: false
      - key: RAZORPAY_PLAN_CREATOR_STANDARD_ULTRA_YEARLY
        sync: false

  - type: web
    name: recruit-frontend
    runtime: node
    rootDir: frontend
    plan: starter
    buildCommand: bash render-build.sh
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: BACKEND_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false
