<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rolebolt Job Copilot</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="head">
    <img src="../icons/icon128.png" alt="" class="logo" />
    <div>
      <h1>Rolebolt Copilot</h1>
      <p id="connStatus">Checking connection…</p>
    </div>
  </header>

  <section id="connectSection" class="card hidden">
    <p class="muted">Connect your Rolebolt account for AI match scores and one-click job saving.</p>
    <button id="connectBtn" class="btn primary">Connect account</button>
    <details class="manual">
      <summary>Manual token setup</summary>
      <input id="token" type="password" placeholder="Paste auth token" />
      <input id="apiBase" placeholder="API base URL" />
      <button id="saveTokenBtn" class="btn secondary">Save token</button>
    </details>
  </section>

  <section id="jobSection" class="card hidden">
    <label class="label">Job title</label>
    <input id="title" placeholder="Detected from page" />
    <label class="label">Company</label>
    <input id="company" placeholder="Company name" />
    <label class="label">Location</label>
    <input id="location" placeholder="Location (optional)" />

    <div class="actions">
      <button id="analyzeBtn" class="btn primary">Analyze match</button>
      <button id="saveBtn" class="btn secondary">Save to workspace</button>
    </div>
    <button id="panelBtn" class="btn ghost">Open live panel on page</button>
  </section>

  <section id="resultSection" class="card hidden">
    <div id="scoreBlock" class="score-block"></div>
    <p id="resultSummary" class="summary"></p>
    <ul id="strengthList" class="mini-list"></ul>
  </section>

  <footer class="foot">
    <button id="workspaceBtn" class="link">Job Workspace</button>
    <span>·</span>
    <button id="disconnectBtn" class="link muted-link">Disconnect</button>
  </footer>

  <div id="status" class="status" role="status"></div>
  <script src="popup.js" type="module"></script>
</body>
</html>
