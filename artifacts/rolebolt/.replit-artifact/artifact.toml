kind = "web"
previewPath = "/"
title = "Rolebolt"
description = "Rolebolt is a recruiting and job-seeker workspace that helps creators manage hiring pipelines and lets candidates discover opportunities, build resumes, and track applications."
version = "1.0.0"
id = "artifacts/rolebolt"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24693

[services.development]
run = "pnpm --filter @workspace/rolebolt run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rolebolt", "run", "build" ]
serve = "static"
publicDir = "artifacts/rolebolt/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24693"
BASE_PATH = "/"
